services:
  lawfirm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidhi_lawfirm_local
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/lawfirm_db
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=lawfirm_db
      - SECRET_KEY=vidhi-law-firm-nepal-super-secret-jwt-key-2083
      - APP_PORT=8999
    ports:
      - "8999:8999"
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
    networks:
      - erp_default

networks:
  erp_default:
    external: true
