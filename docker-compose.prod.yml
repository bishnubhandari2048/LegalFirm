services:
  lawfirm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidhi_lawfirm_app
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env.production
    volumes:
      - lawfirm_uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8999/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  lawfirm_uploads:
    name: vidhi_lawfirm_uploads
